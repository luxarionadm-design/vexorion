<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexorion - Vanilla Example</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }
    .container { max-width: 800px; margin: 0 auto; }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 { margin-bottom: 16px; color: #333; }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      cursor: pointer;
      font-size: 14px;
      margin: 4px;
    }
    button:hover { background: #0056b3; }
    button.danger { background: #dc3545; }
    button.danger:hover { background: #c82333; }
    button.success { background: #28a745; }
    button.success:hover { background: #218838; }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin: 8px 0;
      font-size: 14px;
    }
    .status {
      padding: 12px;
      background: #e9ecef;
      border-radius: 6px;
      margin: 8px 0;
      font-size: 14px;
    }
    .error { color: #dc3545; }
    .success { color: #28a745; }
    .log-container {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 16px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
    }
    .flex { display: flex; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Vexorion - Vanilla JS Example</h1>
    
    <!-- Fetch Example -->
    <div class="card">
      <h2>📡 Fetch API</h2>
      <div class="flex">
        <button onclick="fetchUsers()">Get Users</button>
        <button onclick="fetchPosts()">Get Posts</button>
        <button onclick="clearFetchResult()">Clear</button>
      </div>
      <div id="fetchResult" class="status">Click a button to fetch data</div>
    </div>

    <!-- Storage Example -->
    <div class="card">
      <h2>💾 Local Storage</h2>
      <input type="text" id="storageKey" placeholder="Key" value="user">
      <input type="text" id="storageValue" placeholder="Value" value="John Doe">
      <div class="flex">
        <button onclick="saveStorage()">Save</button>
        <button onclick="getStorage()">Get</button>
        <button onclick="removeStorage()">Remove</button>
        <button onclick="clearStorage()">Clear All</button>
      </div>
      <div id="storageResult" class="status">No data</div>
    </div>

    <!-- Toggle Example -->
    <div class="card">
      <h2>🔄 Toggle</h2>
      <div class="flex">
        <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
        <button onclick="darkMode.on()">On</button>
        <button onclick="darkMode.off()">Off</button>
      </div>
      <div id="toggleResult" class="status">Dark Mode: OFF</div>
    </div>

    <!-- Debounce Example -->
    <div class="card">
      <h2>⏱️ Debounce</h2>
      <input type="text" id="debounceInput" placeholder="Type something..." oninput="handleDebounceInput(this.value)">
      <div id="debounceResult" class="status">Waiting for input...</div>
    </div>

    <!-- Form Example -->
    <div class="card">
      <h2>📝 Form Validation</h2>
      <form id="demoForm">
        <input type="text" id="formName" placeholder="Name" name="name">
        <input type="email" id="formEmail" placeholder="Email" name="email">
        <input type="number" id="formAge" placeholder="Age" name="age">
        <button type="submit">Submit</button>
      </form>
      <div id="formResult" class="status">Fill the form</div>
    </div>

    <!-- Logger Example -->
    <div class="card">
      <h2>📋 Logger</h2>
      <div class="flex">
        <button onclick="logInfo()">Info</button>
        <button onclick="logWarn()">Warn</button>
        <button onclick="logError()">Error</button>
        <button onclick="clearLogs()">Clear</button>
      </div>
      <div id="logContainer" class="log-container">Logs will appear here...</div>
    </div>

    <!-- WebSocket Example -->
    <div class="card">
      <h2>🔌 WebSocket</h2>
      <div class="flex">
        <button onclick="connectWebSocket()">Connect</button>
        <button onclick="sendWebSocketMessage()">Send Message</button>
        <button onclick="closeWebSocket()">Disconnect</button>
      </div>
      <div id="wsStatus" class="status">Disconnected</div>
      <div id="wsMessages" class="status">No messages</div>
    </div>

    <!-- Timer Example -->
    <div class="card">
      <h2>⏰ Timer</h2>
      <div class="flex">
        <button onclick="timer.start()">Start</button>
        <button onclick="timer.stop()">Stop</button>
        <button onclick="timer.reset()">Reset</button>
      </div>
      <div id="timerDisplay" class="status">00:00:00.000</div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "vexorion": "../../dist/vexorion.js"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
